<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 700" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1622"/>
      <stop offset="55%" stop-color="#132538"/>
      <stop offset="100%" stop-color="#0d1c2a"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1e5a8e" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#1e5a8e" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <rect width="1920" height="700" fill="url(#bg)"/>
  <rect width="1920" height="700" fill="url(#glow)"/>

  <!-- faint architectural / floorplan outlines: rooms and corridors -->
  <g stroke="#6f9cc2" stroke-width="1.2" fill="none" opacity="0.18">
    <rect x="120" y="120" width="380" height="260"/>
    <rect x="560" y="80" width="260" height="180"/>
    <rect x="560" y="300" width="260" height="220"/>
    <rect x="880" y="140" width="340" height="340"/>
    <rect x="1280" y="90" width="300" height="200"/>
    <rect x="1280" y="330" width="300" height="260"/>
    <rect x="1640" y="150" width="200" height="380"/>
    <line x1="500" y1="220" x2="560" y2="220"/>
    <line x1="820" y1="170" x2="880" y2="170"/>
    <line x1="820" y1="420" x2="880" y2="420"/>
    <line x1="1220" y1="260" x2="1280" y2="260"/>
    <line x1="1580" y1="240" x2="1640" y2="240"/>
    <line x1="1580" y1="430" x2="1640" y2="430"/>
  </g>

  <!-- scene-graph edges -->
  <g stroke="#a9c8e0" stroke-width="1.4" opacity="0.28">
    <line x1="300" y1="250" x2="690" y2="170"/>
    <line x1="690" y1="170" x2="1050" y2="310"/>
    <line x1="1050" y1="310" x2="1430" y2="190"/>
    <line x1="1050" y1="310" x2="1430" y2="460"/>
    <line x1="1430" y1="460" x2="1740" y2="340"/>
    <line x1="690" y1="170" x2="690" y2="410"/>
    <line x1="300" y1="250" x2="300" y2="470"/>
  </g>

  <!-- navigation path (highlighted route through the graph) -->
  <path d="M 300 470 C 420 400, 520 300, 690 170 S 900 260, 1050 310 S 1300 230, 1430 190"
        fill="none" stroke="#e6c84a" stroke-width="3" stroke-dasharray="2 14"
        stroke-linecap="round" opacity="0.85"/>

  <!-- graph nodes -->
  <g>
    <circle cx="300" cy="250" r="7" fill="#a9c8e0" opacity="0.5"/>
    <circle cx="300" cy="470" r="9" fill="#e6c84a" filter="url(#soft)"/>
    <circle cx="300" cy="470" r="5" fill="#e6c84a"/>
    <circle cx="690" cy="170" r="9" fill="#e6c84a" filter="url(#soft)"/>
    <circle cx="690" cy="170" r="5" fill="#e6c84a"/>
    <circle cx="690" cy="410" r="7" fill="#a9c8e0" opacity="0.5"/>
    <circle cx="1050" cy="310" r="9" fill="#e6c84a" filter="url(#soft)"/>
    <circle cx="1050" cy="310" r="5" fill="#e6c84a"/>
    <circle cx="1430" cy="190" r="10" fill="#e6c84a" filter="url(#soft)"/>
    <circle cx="1430" cy="190" r="6" fill="#fff"/>
    <circle cx="1430" cy="460" r="7" fill="#a9c8e0" opacity="0.45"/>
    <circle cx="1740" cy="340" r="7" fill="#a9c8e0" opacity="0.4"/>
  </g>

  <!-- embodied agent marker at the leading edge of the path -->
  <g transform="translate(1430,190)">
    <circle r="22" fill="none" stroke="#e6c84a" stroke-width="1.5" opacity="0.6"/>
    <circle r="34" fill="none" stroke="#e6c84a" stroke-width="1" opacity="0.3"/>
  </g>

  <!-- subtle distant grid for depth -->
  <g stroke="#3a5468" stroke-width="0.6" opacity="0.15">
    <line x1="0" y1="600" x2="1920" y2="600"/>
    <line x1="0" y1="640" x2="1920" y2="655"/>
    <line x1="0" y1="680" x2="1920" y2="700"/>
  </g>
</svg>
